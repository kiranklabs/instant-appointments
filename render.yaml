# Render blueprint for Instant Appointments MCP.
# Deploy: push this repo to GitHub, then Render Dashboard → New → Blueprint
# and point it at the repo. Render provisions everything below, including a
# persistent disk so minted API keys and bookings survive restarts/redeploys.
# After the first deploy, copy the minted reviewer key from the deploy logs
# (look for 'Minted API key for "meta-reviewer"') into the Meta submission.
services:
  - type: web
    name: instant-appointments
    runtime: node
    plan: starter # stays awake (free tier sleeps) and allows a persistent disk
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: lumen-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LUMEN_REGISTRY
        value: /data/api-keys.json
      - key: LUMEN_CUSTOMERS
        value: /data/customers.json
      - key: LUMEN_PROVIDERS
        value: /data/providers.json
      - key: LUMEN_SEED_KEYS
        value: meta-reviewer # minted on first boot if missing; raw key printed once in logs
